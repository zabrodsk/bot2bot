<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
<title id="t">What the relay sees, and what the receiving bot sees</title>
<desc id="d">The relay sees who sent a message to whom, when, its size and whether it was delivered. The text is scrambled. Only the receiving bot can open it and check who sent it.</desc>
<style>
  .card { fill: #f6f7f9; stroke: #e3e6eb; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .ink { fill: #1a2230; } .mute { fill: #69738a; } .blue { fill: #2747c9; } .amber { fill: #d4851a; } .ok { fill: #1f8f4e; }
  .head { fill: #ffffff; stroke: #1a2230; stroke-width: 2.5; }
  .eye { fill: #1a2230; }
  .lid { fill: none; stroke: #1a2230; stroke-width: 2.5; stroke-linecap: round; }
  .stalk { stroke: #1a2230; stroke-width: 2.5; stroke-linecap: round; }
  .wire { fill: none; stroke: #c3c9d4; stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
  .fill-in { transform-box: fill-box; transform-origin: center; }

  .panel { fill: #ffffff; stroke: #e3e6eb; stroke-width: 1.5; }
  .row { stroke: #e3e6eb; stroke-width: 1.5; }
  .n { opacity: 0; animation: n 6s infinite steps(1); }
  .n0 { animation-delay: 0.0s; } .n1 { animation-delay: -1.5s; } .n2 { animation-delay: -3.0s; } .n3 { animation-delay: -4.5s; }
  @keyframes n { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
  .reveal { animation: reveal 6s infinite cubic-bezier(.65,0,.35,1); }
  @keyframes reveal { 0%, 10% { transform: scaleX(1); } 40%, 85% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  .cover { transform-box: fill-box; transform-origin: 100% 50%; }
  .key { animation: key 6s infinite cubic-bezier(.65,0,.35,1); transform-box: fill-box; transform-origin: center; }
  @keyframes key { 0%, 8% { transform: translateX(-14px); opacity: 0; } 14%, 40% { transform: none; opacity: 1; } 48%, 100% { transform: translateX(10px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .n0 { opacity: 1; } .cover { transform: scaleX(0); } .key { opacity: 0; } }
  </style>
<rect class="card" x="1" y="1" width="958" height="358" rx="26" stroke-width="1.5"/>

  <!-- Left: the relay -->
  <text class="sans ink" x="40" y="54" font-size="17" font-weight="600">What the relay sees</text>
  <text class="sans mute" x="40" y="76" font-size="13.5">Enough to wake the right bot. Not the words.</text>
  <rect class="panel" x="40" y="96" width="420" height="230" rx="18"/>
  
    <text class="sans mute" x="62" y="130" font-size="13.5">From</text>
    <text class="mono ink" x="170" y="130" font-size="13.5">tom’s bot</text>
    <line class="row" x1="62" x2="438" y1="140" y2="140"/>
    <text class="sans mute" x="62" y="160" font-size="13.5">To</text>
    <text class="mono ink" x="170" y="160" font-size="13.5">anna’s bot</text>
    <line class="row" x1="62" x2="438" y1="170" y2="170"/>
    <text class="sans mute" x="62" y="190" font-size="13.5">When</text>
    <text class="mono ink" x="170" y="190" font-size="13.5">Sun 19:42</text>
    <line class="row" x1="62" x2="438" y1="200" y2="200"/>
    <text class="sans mute" x="62" y="220" font-size="13.5">Size</text>
    <text class="mono ink" x="170" y="220" font-size="13.5">412 bytes</text>
    <line class="row" x1="62" x2="438" y1="230" y2="230"/>
    <text class="sans mute" x="62" y="250" font-size="13.5">Delivered</text>
    <text class="mono ink" x="170" y="250" font-size="13.5">yes</text>
    <line class="row" x1="62" x2="438" y1="260" y2="260"/>
  <text class="sans mute" x="62" y="284" font-size="13.5">Text</text>
  <g class="mono" font-size="13.5" fill="#69738a">
    <text class="n n0" x="170" y="284">Xq9vT2c0kLmB4wZ7hN1pR8sYfE3jAu</text><text class="n n1" x="170" y="284">m3KbV8yQ0tWc5LnZ2rHx9fJp7gAs1E</text><text class="n n2" x="170" y="284">Z0pNc7RhqY2vK9wLm4Tb8xFs1GjE6d</text><text class="n n3" x="170" y="284">f8LwQ2nK5yVb0tRc9mZh3pXs7JgA1E</text>
  </g>

  <!-- Middle: the key only Anna's bot has -->
  <g class="key">
    <circle cx="500" cy="210" r="10" fill="none" stroke="#2747c9" stroke-width="3"/>
    <path d="M510 210 h22 m-7 0 v8 m-8 -8 v6" fill="none" stroke="#2747c9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right: Anna's bot -->
  <text class="sans ink" x="560" y="54" font-size="17" font-weight="600">What Anna’s bot sees</text>
  <text class="sans mute" x="560" y="76" font-size="13.5">Only her bot has the key that opens it.</text>
  <rect class="panel" x="560" y="96" width="360" height="230" rx="18"/>
  <text class="sans mute" x="582" y="130" font-size="13.5">From Tom’s bot</text>
  <text class="sans ink" x="582" y="168" font-size="20" font-weight="500">Dinner on Sunday?</text>
  <text class="sans ink" x="582" y="196" font-size="20" font-weight="500">Gran is coming too.</text>
  <g font-size="13.5" class="sans">
    <rect x="582" y="222" width="120" height="34" rx="17" fill="none" stroke="#e3e6eb" stroke-width="1.5"/>
    <text class="ink" x="642" y="244" text-anchor="middle">Yes, we’re in</text>
    <rect x="712" y="222" width="110" height="34" rx="17" fill="none" stroke="#e3e6eb" stroke-width="1.5"/>
    <text class="ink" x="767" y="244" text-anchor="middle">Can’t make it</text>
  </g>
  <circle cx="590" cy="292" r="7" fill="#1f8f4e"/>
  <path d="M586.5 292 l2.5 2.5 l4.5 -5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans mute" x="604" y="297" font-size="13.5">Signature checked: it really came from Tom’s bot</text>
  <rect class="cover reveal" x="574" y="146" width="336" height="118" rx="10" fill="#ffffff"/>
  
</svg>
